name: Build NetLove
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: netlove-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node scripts/vn-contract.mjs src/story/story.json
      - run: npm run test:materials
      - run: node scripts/vn-materials.mjs export .reuse-kit/v1.2.0
      - uses: actions/upload-artifact@v4
        with:
          name: NetLove-Reusable-Materials
          path: .reuse-kit/v1.2.0/
          include-hidden-files: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline voice sources and runtime audio
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python scripts/validate-voice.py
      - name: Verify every full-dialogue byte and runtime image
        run: |
          python -m pip install Pillow
          python tools/production/validate_runtime.py --require-complete --decode --report reports/full-media.json
      - name: Test atomic release failure paths
        run: python3 -m unittest discover -s scripts -p 'test_publish_release.py' -v
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: NetLove-PWA
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NetLove-Previews
          path: test-results/previews/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NetLove-Test-Report
          path: playwright-report/
  windows:
    needs: web
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run desktop:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:desktop:packaged
      - name: Verify installed upgrade and portable outer wrapper
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run test:desktop:installed
      - uses: actions/upload-artifact@v4
        with:
          name: NetLove-Windows-x64
          path: release/*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NetLove-Desktop-Previews
          path: test-results/desktop/
  release:
    needs: [web, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NetLove-Windows-x64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: NetLove-PWA
          path: pwa
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package tested artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          (cd pwa && zip -q -r "../release-assets/NetLove-PWA-$VERSION.zip" .)
          (cd release-assets && sha256sum *.exe *.zip > SHA256SUMS.txt)
      - name: Upload draft, verify every byte, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NetLove-Public-Readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-readback/result.json
          if-no-files-found: warn
